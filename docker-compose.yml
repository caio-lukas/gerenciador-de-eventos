services:
  db:
    image: postgres:15-alpine
    container_name: evento_db
    restart: always
    environment:
      POSTGRES_DB: evento_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
